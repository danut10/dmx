<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add Candidate — DMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-3">Add Candidate</h1>
      <nav class="mb-3">
        <a href="/" class="me-3">Home</a>
        <a href="/candidates">Candidates</a>
      </nav>

      <form id="candidate-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input id="c_name" name="name" class="form-control" placeholder="Name (max 100)" maxlength="100" required />
        </div>
        <button id="candidate-submit" type="submit" class="btn btn-primary">Add Candidate</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
    <script>
      if (window.initCandidates) window.initCandidates();
    </script>
  </body>
</html>
