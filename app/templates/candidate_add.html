<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add Candidate — DMX</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Add Candidate</h1>
    <nav>
      <a href="/">Home</a> |
      <a href="/candidates">Candidates</a>
    </nav>

    <div id="toast" class="toast" aria-live="polite" style="display:none"></div>

    <main>
      <section>
        <form id="candidate-form" novalidate>
          <label>Name<br>
            <input id="c_name" name="name" placeholder="Name (max 100)" maxlength="100" required />
          </label>
          <br />
          <button id="candidate-submit" type="submit">Add Candidate</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
    <script>
      if (window.initCandidates) window.initCandidates();
    </script>
  </body>
</html>
