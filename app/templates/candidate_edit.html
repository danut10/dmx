<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit Candidate — DMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-3">Edit Candidate</h1>
      <nav class="mb-3">
        <a href="/" class="me-3">Home</a>
        <a href="/candidates">Candidates</a>
      </nav>

      <div id="candidate-edit">Loading…</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const id = location.pathname.split('/').pop();
      async function load(){
        const res = await fetch('/api/candidates/' + id);
        if (!res.ok) return document.getElementById('candidate-edit').textContent = 'Not found';
        const p = await res.json();
        document.getElementById('candidate-edit').innerHTML = `\n          <form id='edit-form' novalidate>\n            <div class="mb-3">\n              <label class='form-label'>Name</label>\n              <input id='name' class='form-control' maxlength='100' value='${p.name}' required />\n            </div>\n            <button type='submit' class='btn btn-primary'>Save</button>\n          </form>\n        `;
        document.getElementById('edit-form').onsubmit = async (e) => {
          e.preventDefault();
          const body = { name: document.getElementById('name').value.trim() };
          await fetch('/api/candidates/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          location.href = '/candidate/view/' + id;
        };
      }
      load();
    </script>
  </body>
</html>
