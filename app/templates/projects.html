<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Projects — DMX</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Projects</h1>
    <nav>
      <a href="/">Home</a> |
      <a href="/candidates">Candidates</a>
    </nav>

    <div id="toast" class="toast" aria-live="polite" style="display:none"></div>

    <div class="grid">
      <main>
        <section>
          <h2>List <a href="/project/add" class="add-link">Add Project</a></h2>
          <table id="project-table" class="list-table">
            <thead>
              <tr><th>Code</th><th>Name</th><th>Description</th><th>Actions</th></tr>
            </thead>
            <tbody id="project-list"><tr><td colspan="4">Loading…</td></tr></tbody>
          </table>
        </section>
      </main>

      
    </div>

    <script src="/static/app.js"></script>
    <script>
      if (window.initProjects) window.initProjects();
    </script>
  </body>
</html>
