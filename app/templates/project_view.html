<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>View Project — DMX</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Project</h1>
    <nav>
      <a href="/">Home</a> |
      <a href="/projects">Projects</a>
    </nav>

    <div id="project-view">Loading…</div>

    <script>
      const id = location.pathname.split('/').pop();
      async function load(){
        const res = await fetch('/api/projects/' + id);
        if (!res.ok) return document.getElementById('project-view').textContent = 'Not found';
        const p = await res.json();
        document.getElementById('project-view').innerHTML = `<h2>${p.code} — ${p.name}</h2><p>${p.descr||''}</p><p><a href='/project/edit/${p.id}'>Edit</a></p>`;
      }
      load();
    </script>
  </body>
</html>
