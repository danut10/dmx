<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>View Project — DMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-3">Project</h1>
      <nav class="mb-3">
        <a href="/" class="me-3">Home</a>
        <a href="/projects">Projects</a>
      </nav>

      <div id="project-view">Loading…</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const id = location.pathname.split('/').pop();
      async function load(){
        const res = await fetch('/api/projects/' + id);
        if (!res.ok) return document.getElementById('project-view').textContent = 'Not found';
        const p = await res.json();
        document.getElementById('project-view').innerHTML = `\n          <div class="card">\n            <div class="card-body">\n              <h2 class="card-title">${p.code} — ${p.name}</h2>\n              <p class="card-text">${p.descr||''}</p>\n              <p><a class='btn btn-secondary btn-sm' href='/project/edit/${p.id}'>Edit</a></p>\n            </div>\n          </div>\n        `;
      }
      load();
    </script>
  </body>
</html>
