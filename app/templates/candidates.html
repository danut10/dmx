<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Candidates — DMX</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Candidates</h1>
    <nav>
      <a href="/">Home</a> |
      <a href="/projects">Projects</a>
    </nav>

    <div id="toast" class="toast" aria-live="polite" style="display:none"></div>

    <div class="grid">
      <main>
        <section>
          <h2>List</h2>
          <div id="candidate-list">Loading…</div>
        </section>

        <section>
          <h2>Add Candidate</h2>
          <form id="candidate-form" novalidate>
            <label>Name<br>
              <input id="c_name" name="name" placeholder="Name (max 100)" maxlength="100" required />
            </label>
            <br />
            <button id="candidate-submit" type="submit">Add Candidate</button>
          </form>
        </section>
      </main>

      <aside id="candidate-detail" class="detail">
        <h2>Candidate Details</h2>
        <div id="candidate-detail-content">Select a candidate to see details.</div>
      </aside>
    </div>

    <script src="/static/app.js"></script>
    <script>
      if (window.initCandidates) window.initCandidates();
    </script>
  </body>
</html>
