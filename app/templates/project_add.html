<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add Project — DMX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-3">Add Project</h1>
      <nav class="mb-3">
        <a href="/" class="me-3">Home</a>
        <a href="/projects">Projects</a>
      </nav>

      <form id="project-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Code</label>
          <input id="code" name="code" class="form-control" placeholder="Code (max 5)" maxlength="5" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input id="name" name="name" class="form-control" placeholder="Name (max 100)" maxlength="100" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="descr" name="descr" class="form-control" placeholder="Description"></textarea>
        </div>
        <button id="project-submit" type="submit" class="btn btn-primary">Add Project</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
    <script>
      if (window.initProjects) window.initProjects();
    </script>
  </body>
</html>
